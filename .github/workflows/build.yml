# Builds Getway Chat for every OS and arch, launches it on each OS, and on main publishes a
# GitHub Release with integrity like all-completed/rb-keeperd's: fixed asset names, SHA256SUMS
# signed keyless with cosign (bound to this workflow), build provenance attestations, all with
# the workflow's own GITHUB_TOKEN (no PAT, no cross-repo upload). The build matrix follows
# all-completed/remote-browser-keeper's build.yml.
#
#   macOS   x64 + arm64   dmg + zip        (unsigned, not notarized: README "macOS")
#   Windows x64 + arm64   NSIS installer   (unsigned: SmartScreen asks once)
#   Linux   x64 + arm64   AppImage + deb
#
#   https://github.com/vasyaod/agent-getway-desktop/releases/latest/download/<asset>
#
# Verify a download: README "Verify a download".
name: build

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions: {}

env:
  # A release's version and tag: v0.1.<run>, unique and increasing, like agent-getway-phone's.
  VERSION: 0.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: npm ci (no Electron binary; the tests run main.js against a fake Electron)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test

  build:
    name: build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: mac, os: macos-15, native: arm64 }
          - { platform: linux, os: ubuntu-24.04, native: x64 }
          - { platform: win, os: windows-latest, native: x64 }
    env:
      PLATFORM: ${{ matrix.platform }}
      NATIVE: ${{ matrix.native }}
      # No code signing in CI (the artifacts are unsigned, as remote-browser-keeper's are).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Version ${{ env.VERSION }}
        run: npm pkg set version="$VERSION"
      - name: Xvfb (Linux launch check)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Build x64 + arm64, one arch at a time; launch the native one
        run: |
          for arch in x64 arm64; do
            rm -rf dist
            npx electron-builder "--$PLATFORM" "--$arch" --publish never
            node ci/collect.mjs "$PLATFORM" "$arch"
            if [ "$arch" = "$NATIVE" ]; then ci/smoke.sh "$PLATFORM"; fi
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: getway-chat-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7
      - name: Dock screenshots, the latest release beside this build (macOS)
        if: matrix.platform == 'mac'
        continue-on-error: true
        run: ci/dock-shot.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.platform == 'mac'
        continue-on-error: true
        with:
          name: dock-mac
          path: ${{ runner.temp }}/dock/*.png
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: sign, attest, publish
    needs: build
    # Only main of the app's own repo releases. Anywhere else (a branch, a PR, a staging copy of
    # this tree in another repo) the run stops at the builds above.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'vasyaod/agent-getway-desktop'
    runs-on: ubuntu-24.04
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write      # create the release on this repo, with GITHUB_TOKEN
      id-token: write      # keyless cosign + attestation signing (Sigstore OIDC)
      attestations: write  # store the build provenance attestations
    env:
      TAG: v0.1.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
      # The identity cosign binds the SHA256SUMS signature to.
      SIGNER: https://github.com/${{ github.repository }}/.github/workflows/build.yml@${{ github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: getway-chat-*
          merge-multiple: true
      - name: The ten installers, by name
        working-directory: dist
        run: |
          ls -l
          expected="GetwayChat-linux-arm64.AppImage GetwayChat-linux-arm64.deb GetwayChat-linux-x64.AppImage GetwayChat-linux-x64.deb GetwayChat-mac-arm64.dmg GetwayChat-mac-arm64.zip GetwayChat-mac-x64.dmg GetwayChat-mac-x64.zip GetwayChat-win-arm64.exe GetwayChat-win-x64.exe"
          [ "$(ls | sort | tr '\n' ' ' | sed 's/ $//')" = "$expected" ] || { echo "expected exactly: $expected"; exit 1; }
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum GetwayChat-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Sign SHA256SUMS (keyless; Sigstore bundle = signature + certificate + Rekor entry)
        working-directory: dist
        run: |
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          # cosign v3 writes only the bundle; the detached signature and certificate come out of it.
          jq -er '.messageSignature.signature' SHA256SUMS.sigstore.json > SHA256SUMS.sig
          {
            echo '-----BEGIN CERTIFICATE-----'
            jq -er '.verificationMaterial.certificate.rawBytes' SHA256SUMS.sigstore.json | fold -w 64
            echo '-----END CERTIFICATE-----'
          } > SHA256SUMS.pem
          # Both documented forms must verify against this exact workflow and ref.
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
          cosign verify-blob --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/GetwayChat-*
            dist/SHA256SUMS
      - name: Publish the release
        working-directory: dist
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Getway Chat $TAG" --generate-notes \
            GetwayChat-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem SHA256SUMS.sigstore.json
      - name: Check the published release
        working-directory: dist
        run: |
          for f in GetwayChat-*; do
            gh attestation verify "$f" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"
          done
          # The anonymous download URLs the README links (200, or 302 to the asset).
          for f in GetwayChat-* SHA256SUMS SHA256SUMS.sig SHA256SUMS.pem SHA256SUMS.sigstore.json; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$f"
            code="$(curl -sS -o /dev/null -w '%{http_code}' "$url")"
            echo "$code $url"
            case "$code" in 200|302) ;; *) exit 1 ;; esac
          done
