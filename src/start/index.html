<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="theme-color" content="#29B6D1">
  <title>Getway Chat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <img class="logo" src="../assets/icon.png" alt="" width="96" height="96">
    <h1>Getway Chat</h1>
    <p class="lead">agent-getway's chat, signed in with your auth.f-proj.com account.</p>
    <p id="message" class="message" role="status" hidden></p>
    <button id="primary" type="button">Sign in</button>
    <button id="secondary" type="button" class="link" hidden>Cancel</button>
    <p id="hint" class="hint">Signing in opens your browser. Allow <strong>Getway Chat Desktop</strong> there, then come back.</p>
    <p id="version" class="version"></p>
  </main>
  <script src="start.js"></script>
</body>
</html>
